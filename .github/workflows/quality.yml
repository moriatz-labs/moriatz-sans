name: Font quality

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: font-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --requirement requirements.txt
      - run: python scripts/build.py
      - run: python scripts/test_font.py
      - uses: actions/upload-artifact@v7
        with:
          name: moriatz-sans-fonts
          path: |
            dist/
            documentation/moriatz-labs-display.png
            documentation/moriatz-labs-display.svg
